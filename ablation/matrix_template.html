<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSW 日前预测 · 消融矩阵</title>
<style>
:root{color-scheme:light;--ink:#172e3c;--muted:#49616b;--teal:#07665d;--light:#eff6f3;--line:#d5dfdf;--paper:#fff;--canvas:#f2f5f3}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.6 'Inter','Microsoft YaHei',Arial,sans-serif}header{background:#113943;color:white;padding:30px max(4vw,18px) 25px}header .wrap,main,.nav-inner{max-width:1410px;margin:auto}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,3vw,39px);line-height:1.25}header p{margin-top:8px;color:#d1e6e2}.nav{background:#fff;border-bottom:1px solid var(--line);padding:0 max(4vw,18px)}.nav-inner{display:flex;gap:7px;overflow:auto}button,select,input{font:inherit}button{cursor:pointer}.nav button{white-space:nowrap;border:0;border-bottom:3px solid transparent;background:none;padding:13px 13px 10px;color:var(--muted)}.nav button[aria-current=true]{border-color:var(--teal);color:var(--teal);font-weight:700}main{padding:26px max(2vw,12px) 42px}section,.box{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;padding:22px 24px}h2{font-size:23px}h3{font-size:17px;margin:15px 0 7px}.intro{color:var(--muted);margin:5px 0 14px;max-width:94ch}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid var(--line);border-top:4px solid #217d71;border-radius:9px;padding:16px 21px;margin-bottom:15px}.card .large{font-weight:700;font-size:35px;letter-spacing:-1px;margin-right:11px}.card small,small{color:var(--muted)}.card p{margin-top:5px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:13px 0}.toolbar label{font-size:13px;color:var(--muted);display:grid;gap:3px}select,input{border:1px solid #9eb2b1;border-radius:5px;background:white;color:var(--ink);padding:6px 9px}input{min-width:150px}.action{border:1px solid #9eb2b1;border-radius:6px;padding:6px 11px;color:var(--ink);background:white}.action:disabled{cursor:default;opacity:.4}a{color:#05655e;text-underline-offset:3px}.scroll{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:6px}.scroll table{width:100%;font-variant-numeric:tabular-nums;border-collapse:separate;border-spacing:0;text-align:left;font-size:14px}th,td{padding:7px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle}thead th{position:sticky;top:0;background:#edf2f2;color:#2a4852;z-index:2;font-size:13px;white-space:nowrap}tbody tr:last-child td{border-bottom:0}tr>*:last-child{border-right:0}.numeric{text-align:right;white-space:nowrap}.group{color:var(--muted);font-size:12px}.dash{text-align:center;color:#72848c}.mat th:not(:first-child){text-align:center}.mat td:first-child,.wide td:first-child{position:sticky;left:0;background:#fff;z-index:1;font-weight:600;min-width:150px}.mat thead th:first-child,.wide thead th:first-child{left:0;z-index:3}.mat td:not(:first-child){text-align:center}.gap{padding:5px 7px}.effect{font:600 14px/1.4 'Inter','Consolas','Microsoft YaHei',sans-serif;border:1px solid transparent;border-radius:5px;min-width:80px;width:100%;padding:7px 8px;cursor:pointer;color:#22383e}.effect.clear{border-color:currentColor}.effect:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #de9c40;outline-offset:2px}.detailbox{background:#f3f7f6;border-radius:7px;border-left:3px solid var(--teal);padding:10px 14px;margin:14px 0 8px}.detailbox[hidden]{display:none}.detailbox p{margin-top:2px}.legend{color:var(--muted);font-size:13px;line-height:1.5;margin:8px 0}.page-controls{display:flex;gap:10px;align-items:center;margin:10px 0}.page-controls span{font-size:13px;color:var(--muted)}.wide .flag,.wide th.flag{min-width:60px;text-align:center;white-space:normal}.present{color:#00685a;background:#e1f1ea;font-weight:700}.absent{color:#b4bdc0}.tiny{text-decoration:underline;text-underline-offset:3px;border:0;background:none;text-align:left;color:#07665d;padding:0;font:inherit}.wide tbody td:first-child{min-width:240px;max-width:400px;overflow-wrap:anywhere}.raw td{max-width:430px;overflow-wrap:anywhere}.raw th{min-width:86px}.detailbox code{font-size:12px;color:#40565b}.downloads{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:13px}.notes{margin:7px 0 0;padding-left:21px}.subtable{margin-top:12px}.empty{padding:18px;color:var(--muted)}.scroll.short{max-height:45vh}@media(max-width:720px){main{padding:14px 8px}section,.box{padding:15px 12px}.grid{grid-template-columns:1fr;gap:0}.nav{padding:0}.nav button{padding:10px}.scroll table{font-size:13px}.mat td:first-child{min-width:108px}.effect{min-width:65px}.card .large{font-size:28px}}@media print{.nav,.toolbar,.page-controls,.downloads{display:none}main{max-width:100%;padding:0}.scroll{overflow:visible;max-height:none}.card,section{break-inside:avoid}header{padding:12px;color:#162e39;background:white}header p{color:#46555b}}
</style></head><body>
<header><div class="wrap"><h1>NSW 日前预测消融矩阵</h1><p>2010–2013 年训练 · 2014 年验证 · 4 个模型 · 340 个配置 · 368 个配对对照</p></div></header>
<nav class="nav" aria-label="矩阵导航"><div class="nav-inner" id="tabs"></div></nav>
<main id="app"></main><noscript>此交互矩阵需要 JavaScript。也可直接打开同目录的 Excel 工作簿。</noscript>
<script id="matrix-data" type="application/json">__ABLATION_JSON__</script>
<script>
'use strict';
const d=JSON.parse(document.querySelector('#matrix-data').textContent);
const models=['ridge','boost_demand','logistic','boost_price'];
const mn={ridge:'Ridge 回归',boost_demand:'梯度提升回归',logistic:'逻辑回归',boost_price:'梯度提升分类'};
const sourceNames={C:'核心',CW:'核心＋悉尼天气',CR:'核心＋邻州历史',F:'核心＋天气＋邻州'};
const sn={'1_source':'第一轮 · 来源','2_dimension':'第二轮 · 维度','3_construction':'第三轮 · 构造','4_tuning':'调参'};
const tabNames={overview:'总览',sources:'来源矩阵',dimensions:'维度矩阵',construction:'构造矩阵',fields:'配置 × 字段',detail:'完整明细'};
const cn={model:'模型',task:'任务',stage:'阶段',config:'配置',columns:'字段清单',contrast:'对照项目',candidate:'候选',reference:'参照',metric:'指标',primary:'主指标',primary_metric:'主指标',score:'时间折得分',delta_pp:'原始差（百分点）',day_low:'整日下界',day_high:'整日上界',week_low:'7日块下界',week_high:'7日块上界',n_features:'字段数',parameter:'参数',param:'参数',threshold:'概率阈值',MAPE:'MAPE (%)',MAE:'MAE (MW)',Acc:'准确率 (%)',BalAcc:'平衡准确率 (%)',Recall0:'类别 0 召回 (%)',Recall1:'类别 1 召回 (%)',train_rows:'训练档数',validation_rows:'验证档数',delta_vs_yesterday:'相对昨日差',delta_vs_last_week:'相对上周差',fit_predict_seconds:'拟合及预测秒数',source:'配置来源',chosen:'折内选中',winner_model:'入选模型',reference_config:'参照配置',winner_config:'入选配置',winner_score:'入选分数',reference_score:'参照分数',dimension_anchor:'第三轮参照',fixed_winner:'固定参数入围',point_best_model:'分数最优模型',point_best_config:'分数最优配置',selection_reason:'选择依据',method:'基线'};
const byId=new Map(d.scores.map(r=>[r.model+'|'+r.config,r]));
const ciMap=new Map(d.contrasts.map((r,i)=>[r.model+'|'+r.contrast,{...r,i}]));
const html=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,places=3)=>n===null||n===undefined?'—':Number(n).toFixed(places);
const signed=n=>n==null?'—':(n>0?'+':'')+fmt(n);
const dir=m=>m==='ridge'||m==='boost_demand'?-1:1;
const mainMetric=m=>dir(m)<0?'MAPE':'BalAcc';
const metricsLabel=m=>dir(m)<0?'MAPE ↓':'平衡准确率 ↑';
const fl=k=>d.feature_labels[k]||k;
const opts=(values,current)=>values.map(([k,v])=>`<option value="${html(k)}" ${String(k)===String(current)?'selected':''}>${html(v)}</option>`).join('');
const select=(id,label,values,current)=>`<label>${label}<select id="${id}">${opts(values,current)}</select></label>`;
const table=(heads,rows,cls='',extra='')=>`<div class="scroll ${extra}"><table class="${cls}"><thead><tr>${heads.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const tr=cells=>'<tr>'+cells.map(cell=>'<td>'+cell+'</td>').join('')+'</tr>';
const app=document.querySelector('#app');
const details=()=>'<div id="detailbox" class="detailbox" aria-live="polite" hidden></div>';
const showDetail=content=>{const box=document.getElementById('detailbox');if(box){box.innerHTML=content;box.hidden=false;box.scrollIntoView({block:'nearest'})}};
const inputDataLabel='日期、档位、NSW 昨日与上周的同档需求和电价、昨日均价及价差';
function gainBounds(r){const k=dir(r.model);return [k*r.delta_pp,Math.min(k*r.day_low,k*r.day_high),Math.max(k*r.day_low,k*r.day_high),Math.min(k*r.week_low,k*r.week_high),Math.max(k*r.week_low,k*r.week_high)]}
function effect(r){if(!r)return '<span class="dash" title="该模型未评估这个对照">—</span>';const [v,lo,hi]=gainBounds(r);const strength=Math.min(Math.abs(v)/(dir(r.model)<0?.35:1),1);const bg=v>=0?`hsl(160 42% ${97-22*strength}%)`:`hsl(22 65% ${97-18*strength}%)`;const title=`${mn[r.model]}：${signed(v)}；整日 95% [${signed(lo)}, ${signed(hi)}]。点击查看参照。`;return `<button class="effect ${lo>0||hi<0?'clear':''}" style="background:${bg}" title="${html(title)}" data-contrast="${r.i}">${signed(v)}</button>`}
function effectDetail(i){const r=d.contrasts[i], [v,a,b,c,e]=gainBounds(r);showDetail(`<strong>${html(mn[r.model])} · 改善 ${signed(v)} 个百分点</strong><p>候选 <code>${html(r.candidate)}</code>　参照 <code>${html(r.reference)}</code>　·　原始 ${html(r.metric)} 差值 ${signed(r.delta_pp)}</p><p>整日配对 95% 区间 [${signed(a)}, ${signed(b)}]　·　连续 7 日块 95% 区间 [${signed(c)}, ${signed(e)}]（均为改善方向）</p>`)}
function configDetail(m,k){const r=byId.get(m+'|'+k);if(!r)return;showDetail(`<strong>${html(mn[m])} · ${html(k)} · ${r.n_features} 个字段</strong><p>${metricsLabel(m)} ${fmt(r[mainMetric(m)])}%　·　${dir(m)<0?'MAE '+fmt(r.MAE,2)+' MW':'准确率 '+fmt(r.Acc)+'%'}　·　参数 ${html(r.parameter)}${r.threshold!=null?'　概率阈值 '+fmt(r.threshold,2):''}</p><p>${r.columns.map(fl).map(html).join('、')}</p>`)}
const legend='<p class="legend">数值均为改善的百分点，正值为改善。绿底表示改善，橙底表示恶化；边框表示整日配对 95% 区间未跨零。单元格可点选查看候选、参照及两种区间。</p>';
function overview(){
  const cards=d.winners.map(r=>`<div class="card"><strong>${r.task==='demand'?'NSW 需求':'NSW 电价方向'} · 入选模型</strong><p><span class="large">${fmt(r[r.primary])}%</span>${html(metricsLabel(r.model))}</p><small>${html(mn[r.model])} · ${r.n_features} 个字段</small></div>`).join('');
  const rows=d.selection.map(r=>tr([mn[r.model],`<button class="tiny" data-model="${r.model}" data-config="${html(r.config)}">${html(r.config)}</button>`,r.n_features,fmt(r.MAPE),fmt(r.MAE,2),fmt(r.BalAcc),fmt(r.Acc)]));
  for(const lag of ['lag1','lag7']){const ar=d.baselines.find(r=>r.method===lag&&r.task==='demand'),br=d.baselines.find(r=>r.method===lag&&r.task==='price');rows.push(tr([lag==='lag1'?'昨日同档基线':'上周同档基线',lag,'—',fmt(ar.MAPE),fmt(ar.MAE,2),fmt(br.BalAcc),fmt(br.Acc)]))}
  const roll=[2012,2013,2014].map(y=>tr([y,...models.map(m=>signed(d.rolling.find(r=>r.year===y&&r.model===m).gain_pp))]));
  app.innerHTML=`<div class="grid">${cards}</div><section><h2>入围模型与官方基线</h2><p class="intro">68,784 个训练档，17,520 个验证档。每个配置均用相同的市场日。点选配置可查看全部字段。</p>${table(['模型','配置','字段数','MAPE (%) ↓','MAE (MW) ↓','平衡准确率 (%) ↑','准确率 (%) ↑'],rows)}${details()}<h3>如何理解最高分与入选分数</h3><p>回归固定参数的最低 MAPE 为 2.433%，最终保留少一列的 2.436% 构造。分类固定参数最高为 80.165%（完整输入再加异地天气）；调参短名单中核心＋悉尼天气最高，为 79.797%。仅核心为 79.300%，少 4 列，差 0.497 个百分点且配对区间跨零，符合预设的简化规则。</p></section><section><h2>跨年份复核：只加入悉尼天气</h2><p class="intro">单独的时间敏感性检查。每年仅用此前历史拟合；下表为核心＋天气相对于核心的改善百分点。该检查只覆盖这一项对照。</p>${table(['验证年',...models.map(m=>mn[m])],roll)}<p class="legend">2014 年是正式选型年。2015–2026 冻结回放尚未包含在此矩阵中。</p></section><section><h2>原始预测与可筛选文件</h2><div class="downloads"><a href="消融实验矩阵.xlsx">Excel 全量矩阵</a><a href="跨年天气对照.csv">跨年天气对照 CSV</a><a href="../../results/validation.csv.gz">真实值和基线</a>${models.map(m=>`<a href="../../results/predictions/${m}.csv.gz">${mn[m]}逐档预测</a>`).join('')}</div><p class="legend">HTML 中的汇总与矩阵可离线查看。逐档文件的链接使用当前工作目录的相对路径。</p></section>`}
function sources(){const rows=models.map(m=>tr([mn[m]+' · '+metricsLabel(m),...Object.keys(sourceNames).map(k=>{const r=byId.get(m+'|'+k);const val=r[mainMetric(m)];return `<button class="tiny" data-model="${m}" data-config="${k}">${fmt(val)}%</button>`})]));const pairs=[['CW_minus_C','仅加入悉尼天气'],['CR_minus_C','仅加入邻州历史'],['F_minus_CW','已有天气，再加邻州'],['F_minus_CR','已有邻州，再加天气'],['F_minus_C','完整输入相对核心'],['weather_region_interaction','天气与邻州的交互差值']];app.innerHTML=`<section><h2>第一轮 · 信息来源矩阵</h2><p class="intro">核心包括${inputDataLabel}。天气是悉尼气温、湿度、云量和辐射；邻州历史来自昆州、维州。</p>${table(['算法与指标',...Object.values(sourceNames)],rows,'mat')}<h3>来源带来的改善</h3>${legend}${table(['对照',...models.map(m=>mn[m])],pairs.map(([k,t])=>tr([t,...models.map(m=>effect(ciMap.get(m+'|'+k)))])),'mat')}${details()}</section>`}
const ctxOptions=[['add','单独加入核心'],['group','在所在来源中保留'],['full','在完整输入中保留'],['all','三种语境一起看']];let ctx='full';
function dimContrast(m,id,view){const isWeather=id.startsWith('syd_');const prefix=view==='add'?'add_alone_':view==='group'?`retain_in_${isWeather?'CW':'CR'}_`:'retain_in_F_';return ciMap.get(m+'|'+prefix+id)}
function dimensions(){const which=ctx==='all'?['add','group','full']:[ctx];const heads=['维度',...which.flatMap(v=>models.map(m=>`${ctx==='all'?ctxOptions.find(x=>x[0]===v)[1]+'<br>':''}${mn[m]}`))];let rows=d.units.map(u=>tr([`${html(u.label)}<div class="group">${html(u.group)}</div>`,...which.flatMap(v=>models.map(m=>effect(dimContrast(m,u.id,v))))]));app.innerHTML=`<section><h2>第二轮 · 维度贡献矩阵</h2><p class="intro">20 个维度包含单个天气字段、两个州、市场变量、州与变量组合，以及八个单项滞后列。每个维度有三种配对语境，这里覆盖全部 240 个配对。</p><div class="toolbar">${select('context','对照语境',ctxOptions,ctx)}</div>${legend}${table(heads,rows,'mat')}${details()}</section>`;document.querySelector('#context').onchange=e=>{ctx=e.target.value;dimensions()}}
let includeUndo=false;
function construction(){const all=d.contrasts.filter(r=>r.stage==='3_construction');const keys=[...new Set(all.map(r=>r.contrast))].filter(k=>includeUndo||!k.startsWith('confirm_'));const priority=['only_lag1','window7','window28','28_days_vs_7_days','extra_city_weather','extra_cities_given_F','previous_day_profile','no_explicit_gap','spike_max','negative_count','both_spike_stats','combined_vs_anchor'];keys.sort((a,b)=>(priority.includes(a)?priority.indexOf(a):100)-(priority.includes(b)?priority.indexOf(b):100));const anchors=d.selection.map(r=>{const a=byId.get(r.model+'|anchor');return tr([mn[r.model],html(r.dimension_anchor),fmt(a[a.primary])+'%',a.n_features])});app.innerHTML=`<section><h2>第三轮 · 构造方式矩阵</h2><p class="intro">各算法独立选取参照。除明确写出的 28 日对 7 日、完整输入及组合撤回对照外，每个单元格都与本列算法的参照比较。横线表示该算法没有运行这一项。</p>${table(['模型','第三轮参照配置','参照主指标','字段数'],anchors)}<div class="toolbar">${select('undos','显示范围',[['main','主要构造'],['all','包括全部逐项撤回复核']],includeUndo?'all':'main')}</div>${legend}${table(['构造对照',...models.map(m=>mn[m])],keys.map(k=>tr([html(d.contrast_labels[k]||k),...models.map(m=>effect(ciMap.get(m+'|'+k)))])),'mat')}${details()}</section>`;document.querySelector('#undos').onchange=e=>{includeUndo=e.target.value==='all';construction()}}
let fieldState={model:'',stage:'',group:'all',what:'all',query:'',page:0};const groups=[['all','全部 53 个字段'],['core','NSW 核心'],['weather','悉尼与异地天气'],['regions','邻州历史'],['roll','窗口统计'],['spike','尖峰'],['profile','昨日日型']];
function fieldGroup(c){if(c.startsWith('prev_day_type_'))return 'profile';if(c==='prev_price_max'||c==='prev_negative_slots')return 'spike';if(/_(mean|std)(7|28)$/.test(c))return 'roll';if(/^(syd|mel|bne)_/.test(c))return 'weather';if(/^(qld|vic)_/.test(c))return 'regions';return 'core'}
const keysList=(rows)=>new Set(rows.map(r=>r.model+'|'+r.config));
function pagination(page,size,total,prefix){const pages=Math.max(1,Math.ceil(total/size));return `<div class="page-controls"><button class="action" id="${prefix}prev" ${page===0?'disabled':''}>上一页</button><span>第 ${page+1} / ${pages} 页 · 共 ${total} 行</span><button class="action" id="${prefix}next" ${page>=pages-1?'disabled':''}>下一页</button></div>`}
function fields(){const z=fieldState;app.innerHTML=`<section><h2>配置 × 字段开关矩阵</h2><p class="intro">340 个配置 × 53 个字段。每行代表实际评估的一个模型配置；● 为使用，· 为未使用。同一字段组可横向查看，也可筛选只看最终入围配置。</p><div class="toolbar">${select('fm','模型',[['','全部模型'],...models.map(m=>[m,mn[m]])],z.model)}${select('fs','阶段',[['','全部阶段'],...Object.entries(sn)],z.stage)}${select('fg','字段组',groups,z.group)}${select('fw','配置范围',[['all','全部配置'],['selected','四个模型入围'],['winner','两个任务入选']],z.what)}<label>搜索配置<input id="fq" type="search" value="${html(z.query)}" placeholder="例如 window7"></label></div><div id="fieldbody"></div>${details()}</section>`;
  function grid(){const chosen=z.what==='all'?null:keysList(z.what==='selected'?d.selection:d.winners);const rows=d.scores.filter(r=>(!z.model||r.model===z.model)&&(!z.stage||r.stage===z.stage)&&(!chosen||chosen.has(r.model+'|'+r.config))&&r.config.toLowerCase().includes(z.query.toLowerCase()));const cols=d.features.filter(c=>z.group==='all'||fieldGroup(c)===z.group);const slice=rows.slice(z.page*24,z.page*24+24);const header=['模型 / 配置','主指标','字段数',...cols.map(c=>`<span title="${html(c)}">${html(fl(c))}</span>`)];const body=slice.map(r=>'<tr><td>'+`<button class="tiny" data-model="${r.model}" data-config="${html(r.config)}">${mn[r.model]}<br>${html(r.config)}</button></td><td class="numeric">${fmt(r[r.primary])}%</td><td>${r.n_features}</td>`+cols.map(c=>{const on=r.columns.includes(c);return `<td class="flag ${on?'present':'absent'}" title="${html(c)} · ${on?'使用':'未使用'}">${on?'●':'·'}</td>`}).join('')+'</tr>');document.querySelector('#fieldbody').innerHTML=pagination(z.page,24,rows.length,'f')+table(header,body,'wide');document.querySelector('#fprev').onclick=()=>{z.page--;grid()};document.querySelector('#fnext').onclick=()=>{z.page++;grid()};}
  for(const [id,key] of [['fm','model'],['fs','stage'],['fg','group'],['fw','what']])document.querySelector('#'+id).onchange=e=>{z[key]=e.target.value;z.page=0;grid()};document.querySelector('#fq').oninput=e=>{z.query=e.target.value;z.page=0;grid()};grid()}
const rawSets=[['scores','340 组配置指标'],['contrasts','368 个配对对照'],['tuning','180 行时间折调参'],['selection','4 个模型入围'],['winners','2 个任务入选'],['final_comparisons','6 个最终配对'],['baselines','4 行基线指标'],['rolling','12 行跨年天气复核']];let rawState={set:'scores',query:'',page:0};
function raw(){const z=rawState;app.innerHTML=`<section><h2>完整结果明细</h2><p class="intro">数值可追溯到原实验。配对明细中的差值保留原始方向（MAPE 越低越好，平衡准确率越高越好）；可导出筛选结果的全精度 CSV。</p><div class="toolbar">${select('rs','结果表',rawSets,z.set)}<label>按模型、配置或字段搜索<input type="search" id="rq" value="${html(z.query)}" placeholder="例如 boost_price"></label><button class="action" id="export">导出当前筛选 CSV</button></div><div id="rawbody"></div></section>`;
  function refresh(){const rows=d[z.set], cols=Object.keys(rows[0]);const subset=rows.filter(r=>!z.query||Object.values(r).join(' ').toLowerCase().includes(z.query.toLowerCase())||(mn[r.model]||'').includes(z.query));const display=v=>v==null?'—':typeof v==='number'&&!Number.isInteger(v)?fmt(v,4):Array.isArray(v)?v.map(fl).join('、'):html(String(v));const body=subset.slice(z.page*24,z.page*24+24).map(r=>tr(cols.map(c=>display(r[c]))));document.querySelector('#rawbody').innerHTML=pagination(z.page,24,subset.length,'r')+table(cols.map(c=>html(cn[c]||c)),body,'raw');document.querySelector('#rprev').onclick=()=>{z.page--;refresh()};document.querySelector('#rnext').onclick=()=>{z.page++;refresh()};document.querySelector('#export').onclick=()=>{let line=a=>a.map(v=>'"'+String(Array.isArray(v)?JSON.stringify(v):v??'').replaceAll('"','""')+'"').join(',');const text=[line(cols),...subset.map(r=>line(cols.map(k=>r[k])))].join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF',text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=z.set+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
  document.querySelector('#rs').onchange=e=>{z.set=e.target.value;z.page=0;z.query='';raw()};document.querySelector('#rq').oninput=e=>{z.query=e.target.value;z.page=0;refresh()};refresh()}
const views={overview,sources,dimensions,construction,fields,detail:raw};
function render(){const key=location.hash.substring(1);const active=Object.hasOwn(views,key)?key:'overview';document.querySelector('#tabs').innerHTML=Object.entries(tabNames).map(([k,v])=>`<button type="button" aria-current="${k===active}" data-tab="${k}">${v}</button>`).join('');views[active]()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab)location.hash=b.dataset.tab;else if(b.dataset.contrast!==undefined)effectDetail(+b.dataset.contrast);else if(b.dataset.config!==undefined)configDetail(b.dataset.model,b.dataset.config)});window.addEventListener('hashchange',render);render();
</script></body></html>
